# Self-hosted Vastra Studio: web, worker, Postgres, Redis and MinIO (S3 API).
#
#   cp .env.example .env.production      # fill AUTH_SECRET, RESEND_API_KEY and the AI keys
#   docker compose up -d --build
#   open http://localhost:3000            # /api/health reports db, storage and queue
#
# The compose file sets the infrastructure variables itself (database, redis,
# storage), so .env.production only needs the secrets and provider keys. The
# production guard refuses to start without RESEND_API_KEY and real provider
# keys; set ALLOW_MOCK_PROVIDERS=1 in .env.production for a staging box that
# should run on the mocks.

name: vastra

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgres://vastra:${POSTGRES_PASSWORD:-vastra}@postgres:5432/vastra
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: auto
  S3_BUCKET: vastra
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vastra}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-vastra-secret-change-me}
  LOG_FORMAT: json

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vastra}
      POSTGRES_DB: vastra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastra -d vastra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vastra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vastra-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the private bucket once; the app then talks to MinIO with presigned URLs.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-vastra} ${MINIO_ROOT_PASSWORD:-vastra-secret-change-me} &&
        (mc mb --ignore-existing local/vastra) &&
        mc anonymous set none local/vastra
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
